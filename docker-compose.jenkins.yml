services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: proyecto-tareas-jenkins:0.1
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
